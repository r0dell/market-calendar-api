services:
  - type: web
    name: market-calendar-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PAY_TO
        value: "0xC577c27d10767ABfc10D867b443577fE296E7d23"
      - key: X402_NETWORK
        value: mainnet
      - key: CDP_API_KEY_ID
        fromService:
          type: web
          name: market-hours-api
          envVarKey: CDP_API_KEY_ID
      - key: CDP_API_KEY_SECRET
        fromService:
          type: web
          name: market-hours-api
          envVarKey: CDP_API_KEY_SECRET
